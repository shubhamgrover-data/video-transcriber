services:
  whisper:
    build:
      context: ./whisper_service
      dockerfile: Dockerfile
    container_name: clipscribe-whisper
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - PRELOAD_MODEL=true
    ports:
      - "8001:8001"
    volumes:
      - whisper_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    # Uncomment below to enable NVIDIA GPU acceleration on Linux/WSL2:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clipscribe-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - WHISPER_SERVICE_URL=http://whisper:8001
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
    depends_on:
      whisper:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      # Optional: mount exported browser cookies for Facebook/Instagram rate limits
      # - ./cookies.txt:/app/cookies.txt:ro
    restart: unless-stopped

volumes:
  whisper_cache:
